<aside class="author-box" aria-label="About the author">
  <div class="author-avatar" aria-hidden="true">SZ</div>
  <div>
    <p class="author-label">Written by</p>
    <p class="author-name"><a href="{{ '/about/' | relative_url }}">{{ site.author.name | escape }}</a></p>
    <p class="author-bio">{{ site.author.bio | escape }}</p>
    <div class="author-links">
      <a class="pill" href="mailto:{{ site.author.email }}">email</a>
      <a class="pill" href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" target="_blank" rel="noopener">linkedin</a>
      <a class="pill" href="{{ '/feed.xml' | relative_url }}">rss</a>
    </div>
  </div>
</aside>
