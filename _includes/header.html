<header class="site-header">
  <div class="wrapper wrapper--wide header-inner">
    <a class="brand" rel="author" href="{{ '/' | relative_url }}">
      {%- include logo.html -%}
      <span>{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a class="nav-link{% if page.layout == 'home' or page.layout == 'post' %} is-active{% endif %}" href="{{ '/#writing' | relative_url }}">./writing</a>
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title %}
      <a class="nav-link{% if page.url == my_page.url %} is-active{% endif %}" href="{{ my_page.url | relative_url }}">./{{ my_page.title | downcase | escape }}</a>
        {%- endif -%}
      {%- endfor %}
      <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" data-theme-toggle>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
  <div class="read-progress" aria-hidden="true"></div>
</header>
