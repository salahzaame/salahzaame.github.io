<footer class="site-footer">
  <div class="wrapper wrapper--wide footer-inner">
    <div class="footer-brand">
      {%- include logo.html -%}
      <div>
        <strong>{{ site.title | escape }}</strong>
        <span>{{ site.tagline | escape }}</span>
      </div>
    </div>
    <nav class="footer-links" aria-label="Elsewhere">
      <a class="pill" href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" target="_blank" rel="noopener">linkedin</a>
      <a class="pill" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">github</a>
      <a class="pill" href="mailto:{{ site.author.email }}">email</a>
    </nav>
    <div class="footer-meta">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name | escape }} · free to read, free to share</span>
      <span>compiled {{ site.time | date: '%Y.%m.%d %H:%M' }}</span>
    </div>
  </div>
</footer>
