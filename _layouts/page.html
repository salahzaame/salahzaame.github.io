---
layout: default
---
<article class="post wrapper">
  <header class="post-header">
    <p class="post-path"><a href="{{ '/' | relative_url }}">~</a>/{{ page.title | downcase | escape }}.md</p>
    <h1 class="post-title">{{ page.heading | default: page.title | escape }}</h1>
    {%- if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle | escape }}</p>
    {%- endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
